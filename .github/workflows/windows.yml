name: KAMI Original Core Windows
on:
  push:
    branches:
      - feature/kami-original-core
      - feature/kami-avatar-body-physics-dx12
      - feature/kami-avatar-locomotion-dx12
      - feature/kami-native-messenger-offline-preview
      - feature/kami-original-creator-photo-studios
      - feature/kami-native-feature-restoration
      - feature/kami-native-camera-system
  workflow_dispatch:

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent source tree
        run: python3 tests/source_boundary.py
  windows:
    needs: source-boundary
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure original native KAMI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile independent Windows app
        run: cmake --build build --config Release --parallel
      - name: Test native core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package test executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/KAMI | Out-Null
          Copy-Item build/Release/KAMIViewer.exe dist/KAMI
          Copy-Item build/Release/KAMI-DX12-Smoke.exe dist/KAMI
          Copy-Item README.md dist/KAMI
          Compress-Archive -Path dist/KAMI -DestinationPath dist/KAMI-Original-Core-Test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KAMI-Original-Core-TEST-not-yet-SL-viewer
          path: dist/KAMI-Original-Core-Test.zip
          retention-days: 14
