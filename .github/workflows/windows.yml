name: KAMI Original Core Windows
on:
  push:
    branches:
      - feature/kami-original-core
      - fix/kami-sl-login-http400-protocol-fields
      - fix/kami-login-xmlrpc-types-timeouts-response-20261103
      - fix/kami-official-login-identifier-bridge-20261103
      - fix/kami-r3-visible-login-response-diagnostics-20261103
      - feature/kami-sl-login-http-diagnostics
      - feature/kami-live-simulator-udp-and-login-ui
      - feature/kami-dx12-only-live-region-bridge
      - feature/kami-sl-xmlrpc-login-and-sim-handshake
      - feature/kami-creator-obj-import-reliability
      - feature/kami-live-sl-connectivity-foundations
      - feature/kami-eight-axis-chest-twist-butt-depth
      - feature/kami-rigged-avatar-physics-foundation
      - feature/kami-avatar-body-physics-dx12
      - feature/kami-avatar-locomotion-dx12
      - feature/kami-native-messenger-offline-preview
      - feature/kami-original-creator-photo-studios
      - feature/kami-native-feature-restoration
      - feature/kami-native-camera-system
  workflow_dispatch:

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent source tree
        run: python3 tests/source_boundary.py
  windows:
    needs: source-boundary
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure original native KAMI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile independent Windows app
        run: cmake --build build --config Release --parallel
      - name: Validate synthetic Second Life XML-RPC request
        shell: pwsh
        run: |
          # Synthetic fixture only; never expose real login credentials.
          $fixture = & "$PWD/build/Release/kami_sl_login_tests.exe" --emit-synthetic-login-xml
          if ($LASTEXITCODE -ne 0) { throw "Could not generate synthetic XML-RPC request" }
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $settings.XmlResolver = $null
          $reader = [System.Xml.XmlReader]::Create(
            [System.IO.StringReader]::new($fixture), $settings)
          $xml = [System.Xml.XmlDocument]::new()
          $xml.XmlResolver = $null
          try {
            $xml.Load($reader)
            $method = $xml.SelectSingleNode("/methodCall/methodName")
            $struct = $xml.SelectSingleNode("/methodCall/params/param/value/struct")
            if ($null -eq $method -or $method.InnerText -ne "login_to_simulator" -or
                $null -eq $struct) { throw "Malformed XML-RPC method or struct" }
            $fields = @{}
            foreach($member in $struct.SelectNodes("member")) {
              $name = $member.SelectSingleNode("name").InnerText
              if ($fields.ContainsKey($name)) { throw "Duplicate XML-RPC key" }
              $fields[$name] = $member
            }
            foreach($key in @("first","last","passwd","id0","mac",
                              "channel","version","platform","options")) {
              if (!$fields.ContainsKey($key)) { throw "Missing XML-RPC field: $key" }
            }
            if ($null -eq $fields["options"].SelectSingleNode("value/array/data")) {
              throw "Options must be an XML-RPC array"
            }
            if ($null -eq $fields["agree_to_tos"].SelectSingleNode("value/boolean")) {
              throw "ToS flag must be an XML-RPC boolean"
            }
          } finally { $reader.Dispose() }
      - name: Test native core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package test executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/KAMI | Out-Null
          Copy-Item build/Release/KAMIViewer.exe dist/KAMI
          Copy-Item build/Release/KAMI_SL_Login_Identity.dll dist/KAMI
          Copy-Item third_party/secondlife-lgpl/LICENSE.LGPL-2.1.txt dist/KAMI
          Copy-Item third_party/secondlife-lgpl/NOTICE.md dist/KAMI
          Copy-Item build/Release/KAMI-DX12-Smoke.exe dist/KAMI
          Copy-Item README.md dist/KAMI
          Compress-Archive -Path dist/KAMI -DestinationPath dist/KAMI-Original-Core-Test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KAMI-Original-Core-TEST-not-yet-SL-viewer
          path: dist/KAMI-Original-Core-Test.zip
          retention-days: 14
