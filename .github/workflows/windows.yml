jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent source tree
        run: python3 tests/source_boundary.py
  windows:
    needs: source-boundary
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure original native KAMI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile independent Windows app
        run: cmake --build build --config Release --target KAMIViewer --parallel
      - name: Validate synthetic Second Life XML-RPC request
        shell: pwsh
        run: |
          # Synthetic fixture only; never expose real login credentials.
          $fixture = & "$PWD/build/Release/kami_sl_login_tests.exe" --emit-synthetic-login-xml
          if ($LASTEXITCODE -ne 0) { throw "Could not generate synthetic XML-RPC request" }
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $settings.XmlResolver = $null
          $reader = [System.Xml.XmlReader]::Create(
            [System.IO.StringReader]::new($fixture), $settings)
          $xml = [System.Xml.XmlDocument]::new()
          $xml.XmlResolver = $null
          try {
            $xml.Load($reader)
            $method = $xml.SelectSingleNode("/methodCall/methodName")
            $struct = $xml.SelectSingleNode("/methodCall/params/param/value/struct")
            if ($null -eq $method -or $method.InnerText -ne "login_to_simulator" -or
                $null -eq $struct) { throw "Malformed XML-RPC method or struct" }
            $fields = @{}
            foreach($member in $struct.SelectNodes("member")) {
              $name = $member.SelectSingleNode("name").InnerText
              if ($fields.ContainsKey($name)) { throw "Duplicate XML-RPC key" }
              $fields[$name] = $member
            }
            foreach($key in @("first","last","passwd","id0","mac",
                              "channel","version","platform","options")) {
              if (!$fields.ContainsKey($key)) { throw "Missing XML-RPC field: $key" }
            }
            if ($null -eq $fields["options"].SelectSingleNode("value/array/data")) {
              throw "Options must be an XML-RPC array"
            }
            if ($null -eq $fields["agree_to_tos"].SelectSingleNode("value/boolean")) {
              throw "ToS flag must be an XML-RPC boolean"
            }
          } finally { $reader.Dispose() }
      - name: Test native core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Force Microsoft WARP virtual GPU and render KAMI DX12
        shell: pwsh
        run: |
          # This is a mandatory virtual-GPU test, not an ordinary DX12
          # fallback that might silently choose the host GPU. The test
          # returns a nonzero exit if WARP is unavailable or rendering fails.
          $exe = "$PWD/build/Release/KAMI-DX12-Smoke.exe"
          & $exe --force-warp 2>&1 | Tee-Object -FilePath warp-gpu-result.txt
          if ($LASTEXITCODE -ne 0) {
            throw "WARP software GPU render/resize/texture test failed (exit $LASTEXITCODE)"
          }
          $output = Get-Content warp-gpu-result.txt -Raw
          if ($output -notmatch "KAMI PBR ENVIRONMENT TERRAIN PIXELS VERIFIED") {
            throw "The WARP run did not verify scene capture, IBL and terrain output pixels"
          }
          if ($output -notmatch "KAMI MATERIAL ENVELOPE FORMATS PIXELS VERIFIED") {
            throw "The WARP run did not verify binary/XML/notation material assets produce matching pixels"
          }
          if ($output -notmatch "KAMI STANDARD LLSD MATERIAL PIXELS VERIFIED") {
            throw "The WARP run did not verify standard SL material asset decoding to GPU pixels"
          }
          if ($output -notmatch "KAMI PBR PIXELS VERIFIED") {
            throw "The WARP run did not verify PBR map and alpha output pixels"
          }
          if ($output -notmatch "KAMI TEXTURE PIXELS VERIFIED") {
            throw "The WARP run did not verify sampled texture and shadow pixels"
          }
          if ($output -notmatch "KAMI WARP VIRTUAL GPU VERIFIED") {
            throw "Smoke did not positively identify the forced WARP adapter"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KAMI-R69-Forced-WARP-PBR-Pixel-Verification-Result
          path: warp-gpu-result.txt
          retention-days: 14
      - name: Package explicitly incomplete integration test candidate
        shell: pwsh
        run: |
          # Do not distribute this native workspace as the complete SL viewer.
          # A successful WARP/CTest run does not establish live SL feature parity.
          New-Item -ItemType Directory -Force -Path dist/KAMI | Out-Null
          @'
          KAMI LIVE WORLD INTEGRATION TEST BUILD — NOT THE COMPLETE VIEWER

          This executable is an incomplete independent KAMI workspace.
          DX12 smoke tests and synthetic protocol tests do not verify a
          populated Second Life region, full avatar, inventory or messaging.
          Do not label, announce, or distribute it as a finished KAMI viewer.
          Release remains blocked pending real SL login, populated-world
          geometry/PBR validation, avatar, inventory and messaging integration.
          '@ | Set-Content -Path dist/KAMI/NOT_A_COMPLETE_VIEWER.txt -Encoding UTF8
          Copy-Item build/Release/KAMIViewer.exe dist/KAMI
          Copy-Item build/Release/KAMI_SL_Login_Identity.dll dist/KAMI
          Copy-Item build/Release/KAMI_SL_LLUdpCodec.dll dist/KAMI
          Copy-Item build/Release/KAMI_SL_ExtraParams.dll dist/KAMI
          Copy-Item build/Release/KAMI_SL_TextureEntry.dll dist/KAMI
          New-Item -ItemType Directory -Force -Path dist/KAMI/Source/lludp | Out-Null
          Copy-Item src/sl_reference/official_lludp_zerocode.cpp dist/KAMI/Source/lludp
          Copy-Item include/kami/protocol/official_lludp_zerocode.h dist/KAMI/Source/lludp
          Copy-Item third_party/secondlife-lgpl/lludp/llzerocode.h dist/KAMI/Source/lludp
          Copy-Item third_party/secondlife-lgpl/lludp/stdtypes.h dist/KAMI/Source/lludp
          Copy-Item src/sl_reference/official_extra_params.cpp dist/KAMI/Source/lludp
          Copy-Item src/sl_reference/official_texture_entry.cpp dist/KAMI/Source/lludp
          Copy-Item include/kami/protocol/official_texture_entry.h dist/KAMI/Source/lludp
          Copy-Item include/kami/protocol/official_extra_params.h dist/KAMI/Source/lludp
          Copy-Item third_party/secondlife-lgpl/LICENSE.LGPL-2.1.txt dist/KAMI
          Copy-Item build/_deps/openjpeg-src/LICENSE dist/KAMI/LICENSE.OpenJPEG-BSD2.txt
          Copy-Item third_party/secondlife-lgpl/NOTICE.md dist/KAMI
          # DX12 smoke is executed in CI above; never ship this test tool in the viewer ZIP.
          Copy-Item R69_STATUS.md dist/KAMI
          Copy-Item LICENSE.PicoJSON.txt dist/KAMI
          Copy-Item LICENSE.TinyXML2.txt dist/KAMI
          Copy-Item R57_STATUS.md dist/KAMI
          Copy-Item R56_STATUS.md dist/KAMI
          Copy-Item README.md dist/KAMI
          Copy-Item UNIFIED_BUILD_NOTES.md dist/KAMI
          Copy-Item R27_R32_UNIFIED_STATUS.md dist/KAMI
          Copy-Item R33_STATUS.md dist/KAMI
          Copy-Item R34_STATUS.md dist/KAMI
          Copy-Item R36_STATUS.md dist/KAMI
          Copy-Item R37_STATUS.md dist/KAMI
          Copy-Item R38_STATUS.md dist/KAMI
          Copy-Item R39_STATUS.md dist/KAMI
          Copy-Item R40_STATUS.md dist/KAMI
          Copy-Item R41_STATUS.md dist/KAMI
          Copy-Item R42_STATUS.md dist/KAMI
          Copy-Item R43_STATUS.md dist/KAMI
          Copy-Item R43_1_STATUS.md dist/KAMI
          Copy-Item docs/OFFICIAL_SL_BACKEND_MIGRATION.md dist/KAMI
          Copy-Item UE5_PROTOTYPE_HANDOFF.md dist/KAMI
          Compress-Archive -Path dist/KAMI -DestinationPath dist/KAMI-INCOMPLETE-Live-Integration-TEST.zip
      - name: Gate native KAMI viewer package and feature acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/KAMI'
          if (!(Test-Path "$root/KAMIViewer.exe")) { throw 'Native viewer executable missing' }
          if ((Get-Item "$root/KAMIViewer.exe").Length -lt 65536) { throw 'Native viewer executable unexpectedly small' }
          if (Test-Path "$root/KAMI-DX12-Smoke.exe") { throw 'Do not package diagnostic executable' }
          if (!(Test-Path "$root/NOT_A_COMPLETE_VIEWER.txt")) { throw 'Missing incomplete viewer disclosure' }
          if (!(Test-Path "$root/LICENSE.LGPL-2.1.txt")) { throw 'Missing LGPL license' }
          $manifest = Get-Content 'docs/KAMI_FEATURE_ACCEPTANCE.json' -Raw | ConvertFrom-Json
          if ($manifest.application -ne 'KAMIViewer.exe') {
            throw 'Release manifest must target the native KAMIViewer.exe'
          }
          # An actual release can be enabled after the feature evidence is
          # verified; do not permanently hardcode release_allowed=false.
          if ($manifest.release_allowed -eq $true) {
            if (@($manifest.release_blockers).Count -ne 0) {
              throw 'Release cannot be enabled while blockers remain'
            }
            foreach ($entry in $manifest.features.PSObject.Properties) {
              if ($entry.Value.status -ne 'verified') {
                throw "Release requires verified feature: $($entry.Name)"
              }
            }
            if (!(Test-Path 'docs/KAMI_LIVE_SL_ACCEPTANCE.md')) {
              throw 'Missing documented authenticated Second Life acceptance'
            }
            $acceptance = Get-Content 'docs/KAMI_LIVE_SL_ACCEPTANCE.md' -Raw
            if ($acceptance -notmatch 'LIVE_SL_ACCEPTANCE: PASS') {
              throw 'Live SL acceptance has not been recorded as passed'
            }
          } elseif ($manifest.release_allowed -ne $false) {
            throw 'Release permission must be an explicit boolean'
          }
          $required = @('ui','dx12_world','terrain','mesh_residency','sl_login','sl_transport','avatar','inventory','messaging','read_receipts','camera','graphics','creator_studio','photo_studio','smart_sort','accessibility','hotfixes')
          foreach ($feature in $required) {
            if (!$manifest.features.PSObject.Properties[$feature]) { throw "Missing feature gate $feature" }
            if ($manifest.features.$feature.status -notin @('unverified','partial','verified')) {
              throw "Invalid feature status $feature"
            }
          }
          $zip = 'dist/KAMI-INCOMPLETE-Live-Integration-TEST.zip'
          if (!(Test-Path $zip)) { throw 'Native viewer archive missing' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if (!($names | Where-Object { $_.EndsWith('/KAMIViewer.exe') })) {
              throw 'Native viewer absent from ZIP'
            }
            if ($names | Where-Object { $_.EndsWith('/KAMI-DX12-Smoke.exe') }) {
              throw 'Diagnostic executable found in ZIP'
            }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: KAMI-INCOMPLETE-Live-Integration-TEST
          path: dist/KAMI-INCOMPLETE-Live-Integration-TEST.zip
          retention-days: 14

