# Upstream whole-repository lint is not suitable for this fork's historical
# Black Dragon baseline. KAMI has native graphics/LLSD/keyboard/GL checks.
name: pre-commit

on:
  pull_request:
  push:
    branches: [main, contribute]
    tags: [v*]


jobs:
  pre-commit:
    if: github.repository == 'secondlife/viewer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: pre-commit/action@v3.0.1
