name: pre-commit

on:
  pull_request:
  push:
    branches: [main, contribute]
    tags: [v*]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PR comparison requires both the base and the head; shallow clones
          # often produce false negatives when validating a feature branch.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Validate PR changes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure
      - name: Validate full baseline
        if: ${{ github.event_name != 'pull_request' }}
        run: pre-commit run --all-files --show-diff-on-failure
