name: Kombatant Windows build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [kombatant.patch, .github/workflows/kombatant-windows.yaml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
          restore-keys: kombatant-win-deps-v1-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Kombatant viewer changes
        shell: bash
        run: |
          git apply --check kombatant.patch
          git apply kombatant.patch
      - name: Restore omitted snapshot preview source
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          base = 'https://raw.githubusercontent.com/KittyBarnett/rlva/074d3a8dcf875b1837bf946f71a7087ceed33230/'
          paths = ['indra/newview/llfloaterbigpreview.cpp', 'indra/newview/llfloaterbigpreview.h', 'indra/newview/skins/default/xui/en/floater_big_preview.xml']
          for name in paths:
              text = urlopen(base + name).read().decode('utf-8')
              text = text.replace('BOOL postBuild()', 'bool postBuild()').replace('BOOL LLFloaterBigPreview::postBuild()', 'bool LLFloaterBigPreview::postBuild()')
              Path(name).write_text(text)
          p = Path('indra/newview/CMakeLists.txt')
          p.write_text(p.read_text().replace(chr(34)+'--openal=${USE_OPENAL}'+chr(34), chr(34)+'--fmodstudio=${USE_FMODSTUDIO}'+chr(34)+' '+chr(34)+'--openal=${USE_OPENAL}'+chr(34)))
          p = Path('indra/cmake/Copy3rdPartyLibs.cmake')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'openjpeg.dll'))
          p = Path('indra/newview/viewer_manifest.py')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'self.path("openjpeg.dll")'))
          p = Path('indra/newview/kombatantstudio.h')
          p.write_text(p.read_text().replace('[this]() {', '[this](LLUICtrl*, const LLSD&) {'))
          p = Path('kombatant/build-windows.sh')
          p.write_text(p.read_text().replace('autobuild build -A 64 -c ReleaseOS', 'autobuild build --no-configure -A 64 -c ReleaseOS'))
          p = Path('indra/cmake/BuildVersion.cmake')
          p.write_text(p.read_text().replace('VIEWER_SHORT_VERSION REGEX', 'VIEWER_SHORT_VERSION LIMIT_COUNT 1 REGEX'))
      - name: Install Python build tooling
        run: python -m pip install autobuild llsd "cmake<4"
      - name: Build compatible OpenJPEG from public source
        shell: bash
        run: |
          git clone --depth 1 --branch version.1.5.2 https://github.com/uclouvain/openjpeg.git .openjpeg-source
          test "$(git -C .openjpeg-source rev-parse HEAD)" = 9586bc669c4623912ca657328579c878d74164a5
          python -c "from pathlib import Path; p=Path('.openjpeg-source/libopenjpeg/opj_includes.h'); p.write_text(p.read_text().replace('#if defined(_MSC_VER) || defined(__BORLANDC__)', '#if (defined(_MSC_VER) && _MSC_VER < 1800) || defined(__BORLANDC__)'))"
          cmake -S .openjpeg-source -B .openjpeg-build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF -DBUILD_TESTING=OFF -DOPENJPEG_INSTALL_INCLUDE_DIR=include/openjpeg -DCMAKE_INSTALL_PREFIX="$PWD/.openjpeg-install"
          cmake --build .openjpeg-build --config Release --parallel 2
          cmake --install .openjpeg-build --config Release
          python - <<'PY'
          from pathlib import Path
          Path('indra/cmake/OpenJPEG.cmake').write_text('set(OPENJPEG_INCLUDE_DIR "'+str(Path('.openjpeg-install/include/openjpeg').resolve()).replace(chr(92),'/')+'")\nset(OPENJPEG_LIBRARIES "'+str(Path('.openjpeg-install/lib/openjpeg.lib').resolve()).replace(chr(92),'/')+'")\nadd_definitions(-DOPJ_STATIC)\n')
          PY
      - name: Build bundled ReShade runtime and SDK
        shell: pwsh
        run: ./kombatant/build-fx.ps1
      - name: Configure and compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -c "set -o pipefail; bash kombatant/build-windows.sh 2>&1 | tee kombatant-build.log"
      - name: Stage bundled shader runtime, sample, and licenses
        shell: pwsh
        run: ./kombatant/build-fx.ps1 -StageOnly
      - name: Cache downloaded libraries
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kombatant-windows-build-log
          path: |
            kombatant-build.log
            build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml
            indra/third_party/reshade/bin/x64/Release/*.log
          if-no-files-found: warn
      - name: Preserve compiled build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kombatant-windows-release-output
          path: build-vc170-64/newview/Release/
          if-no-files-found: error
          retention-days: 7
