name: KAMI Viewer native Windows build

# Cancel superseded revisions to free scarce Windows CI runners.
concurrency:
  group: kami-native-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    branches: [integration/kami-creator-studio-windows]
  push:
    branches: [master, feature/display-graphics-controls, experimental/dlss-dxr, feature/fsr-xess-upscaling, branding/kami-viewer, feature/kami-native-performance, experimental/kami-optical-flow-framegen, fix/kami-mxao-install-4k-potato, integration/kami-creator-studio-windows, feature/kami-neutral-base-render, feature/kami-true-1440p-core, feature/kami-gpu-auto-detection, feature/kami-visible-qhd-4k-8k, feature/kami-nextgen-theme-workspaces, feature/kami-standalone-portable-cleanup, feature/kami-zero-setup-launch, feature/kami-pbr-compat-toggle, feature/kami-true-pbr-off-legacy, feature/kami-avatar-physics-detection-fix, fix/kami-beta-dx12-warp-crash-diagnostics, fix/kami-beta-dx12-embedded-entrypoint, fix/kami-remove-legacy-avatar-lighting, fix/kami-navigation-controls-overlap, feature/kami-dx12-embedded-viewer-build, feature/kami-dx12-live-scene-bridge, feature/kami-dx12-live-preview]
    # Engine and settings edits must rebuild; previously only kami/ scripts were watched.
    paths: [indra/newview/**, indra/llwindow/**, indra/cmake/**, kombatant.patch, .github/workflows/kombatant-windows.yaml, kombatant/upscale/**, kami/branding/**, kami/performance/**, kami/physics/**, kami/audio/**, kami/avatars/**, kami/cinematic/**, kami/rlv/**, kami/signature/**, kami/atmosphere/**, kami/recovery/**, kami/framegen/**, kami/preview/**, kami/mxao/**, kami/gshade/**, kami/theme/**, kami/alive/**, kami/loading/**, kami/packaging/**, kami/renderer/**, kami/dx12/**, kami/rtx/**, kami/shadows/**, kami/stability/**]
permissions:
  contents: read
jobs:
  framegen-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install software GL test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri
      - name: Execute shipped frame-generation shaders on Mesa
        run: python3 kami/framegen/test-shaders.py
      - name: Verify KAMI Audio Lab native controls and engine bindings
        run: python3 kami/audio/verify-audio-lab.py
      - name: Preflight KAMI ALIVE integration, shaders and frame governor
        run: python3 kami/alive/verify-kami-alive.py
      - name: Preflight KAMI ALIVE material inspector script
        run: python3 kami/alive/verify-material-inspector.py
      - name: Preflight KAMI ALIVE visual profile source safety
        run: python3 kami/alive/verify-alive-visual-profiles.py
      - name: Preflight KAMI Messenger session and UI contract
        run: python3 kami/messenger/verify-kami-messenger.py
      - name: Preflight KAMI Messenger opt-in read receipt protocol
        run: python3 kami/messenger/verify-read-receipts.py
      - name: Preflight Brand Folder Sort integration source
        run: python3 kami/inventory/verify-brand-folder-sort.py
      - name: Preflight KAMI Demo Deleter script safety checks
        run: python3 kami/inventory/verify-demo-cleanup.py
      - name: Preflight ALIVE selected-material scanner and local override
        run: python3 kami/alive/verify-material-inspector.py
      - name: Preflight KAMI Graphics Control Deck source
        run: python3 kami/theme/verify-graphics-control-deck.py
      - name: Validate both modern and legacy keyboard LLSD before Windows build
        run: python3 kami/performance/validate-config-inputs.py
      - name: Verify KAMI WASD startup migration source safeguards
        run: python3 kami/performance/verify-wasd-startup.py
      - name: Enforce neutral native PBR quality and no optional default post passes
        run: python3 kami/renderer/verify-neutral-baseline.py
      - name: Verify true 1440p GPU-resolution sizing and patch syntax
        run: python3 kami/renderer/verify-true-1440p.py
      - name: Check hardware tiering, RTX 5070 and integrated GPU fallback
        run: python3 kami/renderer/verify-gpu-detection.py
      - name: Verify KAMI next-generation native Workspaces theme source
        run: python3 kami/theme/verify-nextgen-workspaces.py
      - name: Verify KAMI graphics modernization source
        run: python3 kami/theme/verify-graphics-panel.py
      - name: Test standalone packaging and preserve source licenses
        run: python3 -m unittest discover -s kami/packaging -p 'test_finalize_kami_standalone.py'
      - name: Enforce no CMD installers and native KAMI login music in source
        run: python3 kami/packaging/verify-zero-setup.py
      - name: Verify QHD/4K/8K actual presentation resolve policy
        run: python3 kami/renderer/verify-visible-supersampling.py
      - name: Verify KAMI true PBR OFF legacy renderer source contracts
        run: python3 kami/renderer/verify-true-pbr-off.py
      - name: Run KAMI's real final postprocess GLSL on headless Mesa
        run: python3 kami/renderer/test-supersample-glsl.py
      - name: Verify Kami Follow Avatar user controls and movement safety
        run: python3 kami/avatars/verify-follow-avatar.py
      - name: Validate Smart Avatar Physics source-patch and test syntax
        run: python3 -m py_compile kami/physics/apply-smart-avatar-physics.py kami/physics/verify-smart-avatar-physics.py
      - name: Verify avatar physics wearable and motion status source contracts
        run: python3 kami/physics/verify-visible-physics-detection.py
      - name: Validate every KAMI and Kombatant Python integration script
        shell: pwsh
        run: python -m compileall -q kami kombatant
      - name: Validate KAMI signature build scripts syntax
        run: python3 -m py_compile kami/signature/apply-signature-features.py kami/signature/verify-signature-features.py
      - name: Validate Atmosphere Engine build scripts
        run: python3 -m py_compile kami/atmosphere/apply-atmosphere.py kami/atmosphere/verify-atmosphere.py
      - name: Validate recovery scripts before Windows compile
        run: python3 -m py_compile kami/recovery/apply-session-recovery.py kami/recovery/verify-session-recovery.py
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
          restore-keys: kombatant-win-deps-v1-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Kombatant viewer changes
        shell: bash
        run: |
          git apply --check kombatant.patch
          git apply kombatant.patch
      - name: Verify D3D12 is linked into actual Windows viewer build
        shell: pwsh
        run: python kami/dx12/verify-viewer-link.py
      - name: Validate real Second Life volume mesh to native DX12 scene bridge
        shell: pwsh
        run: python kami/dx12/verify-live-scene-bridge.py
      - name: Validate native D3D12 live-scene preview and safe FPS cap
        shell: pwsh
        run: python kami/dx12/verify-live-preview.py
      - name: Verify native Audio Lab is integrated before compilation
        shell: pwsh
        run: python kami/audio/verify-audio-lab.py
      - name: Preflight native LLSD settings and keyboard records
        shell: pwsh
        run: python kami/performance/validate-config-inputs.py
      - name: Restore omitted snapshot preview source
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          base = 'https://raw.githubusercontent.com/KittyBarnett/rlva/074d3a8dcf875b1837bf946f71a7087ceed33230/'
          paths = ['indra/newview/llfloaterbigpreview.cpp', 'indra/newview/llfloaterbigpreview.h', 'indra/newview/skins/default/xui/en/floater_big_preview.xml']
          for name in paths:
              text = urlopen(base + name).read().decode('utf-8')
              text = text.replace('BOOL postBuild()', 'bool postBuild()').replace('BOOL LLFloaterBigPreview::postBuild()', 'bool LLFloaterBigPreview::postBuild()')
              Path(name).write_text(text)
          p = Path('indra/newview/CMakeLists.txt')
          p.write_text(p.read_text().replace(chr(34)+'--openal=${USE_OPENAL}'+chr(34), chr(34)+'--fmodstudio=${USE_FMODSTUDIO}'+chr(34)+' '+chr(34)+'--openal=${USE_OPENAL}'+chr(34)))
          p = Path('indra/cmake/Copy3rdPartyLibs.cmake')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'openjpeg.dll'))
          p = Path('indra/newview/viewer_manifest.py')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'self.path("openjpeg.dll")'))
          p = Path('indra/newview/kombatantstudio.h')
          p.write_text(p.read_text().replace('[this]() {', '[this](LLUICtrl*, const LLSD&) {'))
          p = Path('kombatant/build-windows.sh')
          p.write_text(p.read_text().replace('autobuild build -A 64 -c ReleaseOS', 'autobuild build --no-configure -A 64 -c ReleaseOS'))
          p = Path('indra/cmake/BuildVersion.cmake')
          p.write_text(p.read_text().replace('VIEWER_SHORT_VERSION REGEX', 'VIEWER_SHORT_VERSION LIMIT_COUNT 1 REGEX'))
      - name: Integrate native FSR and XeSS into viewer source
        shell: pwsh
        run: python kombatant/upscale/apply-upscalers.py
      - name: Install Python build tooling
        run: python -m pip install autobuild llsd pillow "cmake<4"
      - name: Apply KAMI Viewer logo and identity
        shell: pwsh
        run: python kami/branding/apply-branding.py
      - name: Apply static Beyond Reality fire-garden theme
        shell: pwsh
        run: python kami/theme/apply-static-theme.py
      - name: Remove bundled FX runtime and integrate Performance Mode
        shell: pwsh
        run: python kami/performance/apply-native-performance.py
      - name: Add native advanced lighting and adaptive resolution
        shell: pwsh
        run: python kami/performance/add-advanced-native.py
      - name: Integrate experimental native PBR near-field indirect lighting
        shell: pwsh
        run: python kami/performance/add-native-bounce.py
      - name: Install adaptive performance controls and Potato Mode
        shell: pwsh
        run: python kami/performance/apply-smart-performance.py
      - name: Add performance-friendly lighting and skin options
        shell: pwsh
        run: python kami/performance/add-balanced-graphics.py
      - name: Integrate shadow filtering, reflections, shader caching and auto optimization
        shell: pwsh
        run: python kami/performance/add-mw-render-controls.py
      - name: Integrate experimental OpenGL optical-flow frame generation
        shell: pwsh
        run: python kami/framegen/apply-framegen.py
      - name: Integrate live current-scene graphics preview
        shell: pwsh
        run: python kami/preview/apply-live-preview.py
      - name: Integrate fast login without bypassing outfit readiness
        shell: pwsh
        run: python kami/loading/apply-fast-loading.py
      - name: Clean KAMI login layout and identity
        shell: pwsh
        run: python kami/theme/clean-login.py
      - name: Restore approved KAMI Beyond Reality login theme
        shell: pwsh
        run: python kami/theme/fix-login-theme.py
      - name: Assert setup-free login, original KAMI skin and native MP3 chooser
        shell: pwsh
        run: python kami/packaging/verify-zero-setup.py --integrated
      - name: Correct FPS cap units and separate quality target
        shell: pwsh
        run: python kami/performance/fix-fps-controls.py
      - name: Wire shadow softening independently of SSAO
        shell: pwsh
        run: python kami/shadows/apply-shadow-filter-fix.py
      - name: Contain Performance Mode scaled-view cropping
        shell: pwsh
        run: python kami/stability/keep-performance-native.py
      - name: Remove unsupported 12K live rendering
        shell: pwsh
        run: python kami/stability/remove-12k-live.py
      - name: Remove KAMI native color grading (retain built-in gamma and tone mapping)
        shell: pwsh
        run: python kami/stability/remove-native-color-grading.py
      - name: Fix native AO darkening slider and diffuse occlusion strength
        shell: pwsh
        run: python kami/stability/fix-ao-darkening.py
      - name: Make actual optical-flow frame generation status visible
        shell: pwsh
        run: python kami/stability/fix-optical-flow-runtime.py
      - name: Fix live SSR reflection texture allocation on toggle
        shell: pwsh
        run: python kami/stability/fix-ssr-toggle.py
      - name: Explain actual Performance preset and measured OFF/ON FPS comparison
        shell: pwsh
        run: python kami/stability/explain-performance-preset.py
      - name: Wire five verified quality presets to actual renderer controls
        shell: pwsh
        run: python kami/performance/verify-and-wire-quality-presets.py
      - name: Optimize remote avatar body physics without altering self avatar
        shell: pwsh
        run: python kami/performance/apply-adaptive-avatar-physics.py
      - name: Stabilize and expose actual native 4K/8K world buffer resolution
        shell: pwsh
        run: python kami/stability/fix-live-resolution-quality.py
      - name: Apply approved Fire Garden theme across all native KAMI windows
        shell: pwsh
        run: python kami/theme/apply-fire-garden-ui.py
      - name: Remove obsolete Native Graphics Lab and KAMI Photo Studio UI
        shell: pwsh
        run: python kami/stability/remove-native-lab-studio.py
      - name: Keep all original graphics toggles in Fire Garden base kit
        shell: pwsh
        run: python kami/theme/preserve-base-graphics-kit.py
      - name: Add optional Smart Avatar Physics scheduling and live CPU metrics
        shell: pwsh
        run: python kami/physics/apply-smart-avatar-physics.py
      - name: Add native KAMI Hardware Monitor with Windows usage telemetry
        shell: pwsh
        run: python kami/performance/apply-hardware-monitor.py
      - name: Install KAMI Render Doctor, Smart World, Camera Director and Intelligent Profiles
        shell: pwsh
        run: python kami/signature/apply-signature-features.py
      - name: Install four local EEP atmospheres and reversible Fire Garden mood controls
        shell: pwsh
        run: python kami/atmosphere/apply-atmosphere.py
      - name: Install native KAMI Session Recovery, safe local snapshots and crash prompt
        shell: pwsh
        run: python kami/recovery/apply-session-recovery.py
      - name: Add native live Avatar Quality plus FPS control
        shell: pwsh
        run: python kami/avatars/apply-avatar-quality.py
      - name: Verify reversible avatar-quality live LOD and complete Display scroll
        shell: pwsh
        run: python kami/avatars/verify-avatar-quality.py
      - name: Add opt-in native Dark Cinematic PBR material, EEP lighting and avatar detail
        shell: pwsh
        run: python kami/cinematic/apply-dark-cinematic.py
      - name: Verify all three Dark Cinematic live-render feature paths
        shell: pwsh
        run: python kami/cinematic/verify-dark-cinematic.py
      - name: Install user-controlled RLV emergency safety center (no unsupported engine)
        shell: pwsh
        run: python kami/rlv/apply-rlv-safety.py
      - name: Verify RLV default-deny, real panic menu and no unreviewed RLVa parser
        shell: pwsh
        run: python kami/rlv/verify-rlv-safety.py
      - name: Install KAMI Workspaces native hub, redesigned dock and control deck
        shell: pwsh
        run: python kami/theme/apply-nextgen-workspaces.py
      - name: Verify KAMI native Workspaces and preserve original creator tools
        shell: pwsh
        run: python kami/theme/verify-nextgen-workspaces.py --integrated
      - name: Install KAMI ALIVE material response and frame-time governor
        shell: pwsh
        run: python kami/alive/apply-kami-alive.py
      - name: Verify KAMI ALIVE native shader, menu and frame-budget integration
        shell: pwsh
        run: python kami/alive/verify-kami-alive.py --integrated
      - name: Integrate ALIVE material inspector and local PBR manual preview
        shell: pwsh
        run: python kami/alive/apply-material-inspector.py
      - name: Verify material inspector native selected-face controls
        shell: pwsh
        run: python kami/alive/verify-material-inspector.py --integrated
      - name: Integrate KAMI ALIVE native skin, eyes, gem, fabric and leather profiles
        shell: pwsh
        run: python kami/alive/apply-alive-visual-profiles.py
      - name: Verify KAMI ALIVE profile shaders, baked avatars and user selection
        shell: pwsh
        run: python kami/alive/verify-alive-visual-profiles.py --integrated
      - name: Modernize legacy Graphics tab as KAMI rendering control deck
        shell: pwsh
        run: python kami/theme/modernize-graphics-panel.py
      - name: Verify refreshed Graphics tab preserves native settings
        shell: pwsh
        run: python kami/theme/verify-graphics-panel.py --integrated
      - name: Redesign legacy Graphics tab as native KAMI Control Deck
        shell: pwsh
        run: python kami/theme/modernize-graphics-control-deck.py
      - name: Check graphics options, callbacks and adaptive KAMI ALIVE controls
        shell: pwsh
        run: python kami/theme/verify-graphics-control-deck.py --integrated
      - name: Verify KAMI navigation keeps Back Home Forward and location controls accessible
        shell: pwsh
        run: python kami/theme/verify-navigation-clearance.py
      - name: Verify KAMI four signature feature engines, controls and telemetry
        shell: pwsh
        run: python kami/signature/verify-signature-features.py
      - name: Verify real KAMI Atmosphere Engine and Second Life EEP permissions
        shell: pwsh
        run: python kami/atmosphere/verify-atmosphere.py
      - name: Verify safe and private native KAMI Session Recovery
        shell: pwsh
        run: python kami/recovery/verify-session-recovery.py
      - name: Verify all six real Smart Avatar Physics optimizations and performance stats
        shell: pwsh
        run: python kami/physics/verify-smart-avatar-physics.py
      - name: Integrate actual avatar physics wearable and visible-spring diagnostics
        shell: pwsh
        run: python kami/physics/fix-visible-physics-detection.py
      - name: Verify true avatar physics layer/spring readiness and opt-in throttling
        shell: pwsh
        run: python kami/physics/verify-visible-physics-detection.py --integrated
      - name: Validate KAMI Firestorm-style WASD movement defaults
        shell: pwsh
        run: python kami/performance/validate-wasd-controls.py
      - name: Verify automatic legacy WASD migration on startup
        shell: pwsh
        run: python kami/performance/verify-wasd-startup.py
      - name: Integrate true 1440p core world buffers without altering UI resolution
        shell: pwsh
        run: python kami/renderer/enable-true-1440p.py
      - name: Verify native QHD allocations, UI choices and GPU readout wiring
        shell: pwsh
        run: python kami/renderer/verify-true-1440p.py --integrated
      - name: Integrate first-run GPU identification and hardware-aware QHD defaults
        shell: pwsh
        run: python kami/renderer/add-gpu-detection.py
      - name: Verify active GPU detection and saved graphics preference safety
        shell: pwsh
        run: python kami/renderer/verify-gpu-detection.py --integrated
      - name: Fix native world viewport and visible QHD/4K/8K supersampling
        shell: pwsh
        run: python kami/renderer/fix-visible-supersampling.py
      - name: Check real FBO-to-display viewport wiring and supersample GLSL contract
        shell: pwsh
        run: python kami/renderer/verify-visible-supersampling.py --integrated
      - name: Implement real PBR OFF legacy material and terrain render route
        shell: pwsh
        run: python kami/renderer/apply-true-pbr-off.py
      - name: Verify PBR glTF passes bypassed, legacy fallback and ON restoration
        shell: pwsh
        run: python kami/renderer/verify-true-pbr-off.py --integrated
      - name: Verify all five preset quality levels and native 4K/8K FPS contracts
        shell: pwsh
        run: python kami/performance/verify-preset-contracts.py
      - name: Validate external-only GShade assets and absence of bundled hooks
        shell: pwsh
        run: python kami/gshade/verify-gshade-fx.py
      - name: Verify adaptive avatar physics and actual hardware performance telemetry
        shell: pwsh
        run: python kami/performance/verify-physics-and-monitor.py
      - name: Verify KAMI Messenger UI and SL IM interoperability
        shell: pwsh
        run: python kami/messenger/verify-kami-messenger.py
      - name: Integrate opt-in Kami-to-Kami read acknowledgments
        shell: pwsh
        run: python kami/messenger/apply-read-receipts.py
      - name: Verify native Kami read receipts, consent and real IM hooks
        shell: pwsh
        run: python kami/messenger/verify-read-receipts.py --integrated
      - name: Apply KAMI Smart Sort brand-folder grouping to native inventory
        shell: pwsh
        run: python kami/inventory/apply-brand-folder-sort.py
      - name: Verify Brand Folder Sort inventory moves, guarded actions and UI
        shell: pwsh
        run: python kami/inventory/verify-brand-folder-sort.py --integrated
      - name: Integrate KAMI Demo Deleter inventory Trash preview
        shell: pwsh
        run: python kami/inventory/apply-demo-cleanup.py
      - name: Verify KAMI Demo Deleter native controls and guarded Trash moves
        shell: pwsh
        run: python kami/inventory/verify-demo-cleanup.py --integrated
      - name: Validate all KAMI native graphics patches with named assertions
        shell: pwsh
        run: python kami/stability/validate-next-build.py
      - name: Verify removed legacy avatar lighting stays absent
        shell: pwsh
        run: python kami/performance/verify-legacy-avatar-lighting-removed.py
      - name: Check neutral base renderer after all native graphics integration patches
        shell: pwsh
        run: python kami/renderer/verify-neutral-baseline.py
      - name: Verify native settings and all legacy WASD keybindings
        shell: pwsh
        run: python kami/performance/validate-config-inputs.py
      - name: Fetch pinned AMD FSR and Intel XeSS SDKs
        shell: pwsh
        run: ./kombatant/upscale/build-upscalers.ps1
      - name: Install stabilized ray AO shader
        shell: pwsh
        run: Copy-Item kami/rtx/ray_ao.hlsl kombatant/rtx/ray_ao.hlsl -Force
      - name: Build experimental DLSS and DXR module
        shell: pwsh
        run: ./kombatant/build-rtx.ps1
      - name: Build compatible OpenJPEG from public source
        shell: bash
        run: |
          git clone --depth 1 --branch version.1.5.2 https://github.com/uclouvain/openjpeg.git .openjpeg-source
          test "$(git -C .openjpeg-source rev-parse HEAD)" = 9586bc669c4623912ca657328579c878d74164a5
          python -c "from pathlib import Path; p=Path('.openjpeg-source/libopenjpeg/opj_includes.h'); p.write_text(p.read_text().replace('#if defined(_MSC_VER) || defined(__BORLANDC__)', '#if (defined(_MSC_VER) && _MSC_VER < 1800) || defined(__BORLANDC__)'))"
          cmake -S .openjpeg-source -B .openjpeg-build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF -DBUILD_TESTING=OFF -DOPENJPEG_INSTALL_INCLUDE_DIR=include/openjpeg -DCMAKE_INSTALL_PREFIX="$PWD/.openjpeg-install"
          cmake --build .openjpeg-build --config Release --parallel 2
          cmake --install .openjpeg-build --config Release
          python - <<'PY'
          from pathlib import Path
          Path('indra/cmake/OpenJPEG.cmake').write_text('set(OPENJPEG_INCLUDE_DIR "'+str(Path('.openjpeg-install/include/openjpeg').resolve()).replace(chr(92),'/')+'")\nset(OPENJPEG_LIBRARIES "'+str(Path('.openjpeg-install/lib/openjpeg.lib').resolve()).replace(chr(92),'/')+'")\nadd_definitions(-DOPJ_STATIC)\n')
          PY
      - name: Configure and compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -c "set -o pipefail; bash kombatant/build-windows.sh 2>&1 | tee kombatant-build.log"
      - name: Stage experimental DLSS and DXR runtime
        shell: pwsh
        run: ./kombatant/build-rtx.ps1 -StageOnly
      - name: Stage AMD FSR and Intel XeSS runtimes
        shell: pwsh
        run: ./kombatant/upscale/build-upscalers.ps1 -StageOnly
      - name: Stage and validate portable runtime assets
        shell: pwsh
        run: python kami/packaging/stage-portable-data.py
      - name: Stage KAMI Viewer portable executable
        shell: pwsh
        run: |
          $release = 'build-vc170-64/newview/Release'
          $source = Join-Path $release 'blackdragon-bin.exe'
          if (-not (Test-Path $source)) { throw 'Viewer executable not found after build' }
          Copy-Item $source (Join-Path $release 'KAMIViewer.exe') -Force
          Remove-Item $source -Force
      - name: Finalize KAMI-only portable branding and verify runtime completeness
        shell: pwsh
        run: python kami/packaging/finalize-kami-standalone.py
      - name: Capture native crash dumps from DX12 diagnostics
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kami-dx12-forensics'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          foreach ($exe in @('KAMIViewer.exe', 'kami_dx12_smoke.exe')) {
            $key = Join-Path $wer $exe
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null
          }

      - name: Execute real native D3D12 GPU test inside staged KAMIViewer
        id: viewer_dx12
        shell: pwsh
        run: |
          $release = (Resolve-Path 'build-vc170-64/newview/Release').Path
          $viewer = Join-Path $release 'KAMIViewer.exe'
          if (-not (Test-Path $viewer -PathType Leaf)) { throw 'KAMIViewer.exe missing' }

          # KAMIViewer.exe uses the Windows GUI subsystem. PowerShell's '&'
          # may return before the GUI process exits and leave LASTEXITCODE
          # unset, causing a false failure. Wait on the actual process and
          # inspect its exit code instead, with a hard timeout.
          function Invoke-KamiDx12Test {
            param([string] $Flag, [string] $Description)
            Write-Host "Running KAMI DX12 diagnostic: $Flag"
            $process = Start-Process -FilePath $viewer -ArgumentList $Flag -WorkingDirectory $release -PassThru
            try {
              if (-not $process.WaitForExit(120000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "$Description timed out after 120 seconds"
              }
              $exitCode = $process.ExitCode
              Write-Host "KAMI DX12 diagnostic $Flag exited with code $exitCode"
              if ($exitCode -ne 0) {
                throw "$Description failed with process exit code $exitCode"
              }
            }
            finally {
              $process.Dispose()
            }
          }

          Invoke-KamiDx12Test -Flag '--kami-dx12-warp-test' -Description 'Embedded D3D12 WARP render/readback'
          Write-Host 'PASS: native D3D12 GPU pixel test executed from KAMIViewer.exe'
          Invoke-KamiDx12Test -Flag '--kami-dx12-world-warp-test' -Description 'Native D3D12 indexed world/depth render'
          Write-Host 'PASS: native D3D12 indexed mesh, camera transform and occlusion test inside KAMIViewer.exe'

      - name: Isolate native D3D12 renderer from GUI viewer startup
        if: ${{ always() && (steps.viewer_dx12.outcome == 'success' || steps.viewer_dx12.outcome == 'failure') }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kami-dx12-forensics'
          $result = Join-Path $dir 'standalone-result.txt'
          try {
            cmake -S kami/dx12 -B build-kami-dx12-forensic -G 'Visual Studio 17 2022' -A x64
            if ($LASTEXITCODE -ne 0) { throw "Standalone DX12 configure failed: $LASTEXITCODE" }
            cmake --build build-kami-dx12-forensic --config Release --parallel 2
            if ($LASTEXITCODE -ne 0) { throw "Standalone DX12 compile failed: $LASTEXITCODE" }
            $exe = (Resolve-Path 'build-kami-dx12-forensic/Release/kami_dx12_smoke.exe').Path
            $proc = Start-Process -FilePath $exe -ArgumentList '--warp --offscreen' -WorkingDirectory $dir -PassThru -RedirectStandardOutput (Join-Path $dir 'standalone-stdout.txt') -RedirectStandardError (Join-Path $dir 'standalone-stderr.txt')
            if (-not $proc.WaitForExit(90000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw 'Standalone D3D12 WARP test timed out'
            }
            "Standalone renderer test exit: $($proc.ExitCode)" | Out-File $result
            if ($proc.ExitCode -ne 0) {
              throw "Standalone D3D12 WARP test exited with code $($proc.ExitCode)"
            }
            Write-Host 'PASS: standalone native D3D12 WARP renderer executed and returned 0'
          } catch {
            "Standalone renderer test failure: $_" | Out-File $result
            throw
          }

      - name: Capture KAMI viewer DX12 crash events and trace
        if: ${{ always() && (steps.viewer_dx12.outcome == 'success' || steps.viewer_dx12.outcome == 'failure') }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'kami-dx12-forensics'
          $trace = 'build-vc170-64/newview/Release/kami-dx12-smoke.trace'
          if (Test-Path $trace) { Copy-Item $trace (Join-Path $dir 'viewer-last-dx12-operation.txt') }
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-20)} -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'KAMIViewer.exe|kami_dx12_smoke.exe' } |
            Select-Object TimeCreated, ProviderName, Id, Message | Format-List | Out-String
          $events | Out-File (Join-Path $dir 'windows-crash-events.txt')
          $dumps = @(Get-ChildItem -Path $dir -Filter 'KAMIViewer.exe*.dmp' -File -ErrorAction SilentlyContinue)
          if ($dumps.Count -gt 0) {
            Get-ChildItem -Path $dir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
            throw "Embedded KAMI DX12 test produced $($dumps.Count) unexpected Windows crash dump(s)"
          }
          Write-Host 'PASS: native viewer DX12 test did not generate a local crash dump'
          Get-ChildItem -Path $dir | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Preserve KAMI DX12 validation and crash diagnostics
        if: ${{ always() && (steps.viewer_dx12.outcome == 'success' || steps.viewer_dx12.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: kami-dx12-warp-validation-diagnostics
          path: ${{ runner.temp }}/kami-dx12-forensics/
          if-no-files-found: warn
          retention-days: 7

      - name: Cache downloaded libraries
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kami-viewer-windows-build-log
          path: |
            kombatant-build.log
            build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
      - name: Preserve compiled build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kami-viewer-windows-release-output
          path: build-vc170-64/newview/Release/
          if-no-files-found: error
          retention-days: 7
