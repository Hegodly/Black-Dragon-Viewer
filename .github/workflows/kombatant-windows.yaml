name: KAMI Viewer native Windows build

# Cancel superseded revisions to free scarce Windows CI runners.
concurrency:
  group: kami-native-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [master, feature/display-graphics-controls, experimental/dlss-dxr, feature/fsr-xess-upscaling, branding/kami-viewer, feature/kami-native-performance, experimental/kami-optical-flow-framegen, fix/kami-mxao-install-4k-potato, integration/kami-creator-studio-windows, experimental/kami-diamond-glints]
    # Engine and settings edits must rebuild; previously only kami/ scripts were watched.
    paths: [indra/newview/**, indra/llwindow/**, indra/cmake/**, kombatant.patch, .github/workflows/kombatant-windows.yaml, kombatant/upscale/**, kami/branding/**, kami/performance/**, kami/physics/**, kami/avatars/**, kami/cinematic/**, kami/rlv/**, kami/signature/**, kami/atmosphere/**, kami/recovery/**, kami/framegen/**, kami/preview/**, kami/mxao/**, kami/gshade/**, kami/theme/**, kami/loading/**, kami/packaging/**, kami/rtx/**, kami/shadows/**, kami/stability/**, kami/jewelry/**]
permissions:
  contents: read
jobs:
  framegen-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install software GL test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri glslang-tools
      - name: Execute shipped frame-generation shaders on Mesa
        run: python3 kami/framegen/test-shaders.py
      - name: Validate both modern and legacy keyboard LLSD before Windows build
        run: python3 kami/performance/validate-config-inputs.py
      - name: Compile KAMI native diamond glint shader on Mesa toolchain
        run: python3 kami/jewelry/test-diamond-glints.py
      - name: Validate Smart Avatar Physics source-patch and test syntax
        run: python3 -m py_compile kami/physics/apply-smart-avatar-physics.py kami/physics/verify-smart-avatar-physics.py
      - name: Validate every KAMI and Kombatant Python integration script
        shell: pwsh
        run: python -m compileall -q kami kombatant
      - name: Validate KAMI signature build scripts syntax
        run: python3 -m py_compile kami/signature/apply-signature-features.py kami/signature/verify-signature-features.py
      - name: Validate Atmosphere Engine build scripts
        run: python3 -m py_compile kami/atmosphere/apply-atmosphere.py kami/atmosphere/verify-atmosphere.py
      - name: Validate recovery scripts before Windows compile
        run: python3 -m py_compile kami/recovery/apply-session-recovery.py kami/recovery/verify-session-recovery.py
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
          restore-keys: kombatant-win-deps-v1-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Kombatant viewer changes
        shell: bash
        run: |
          git apply --check kombatant.patch
          git apply kombatant.patch
      - name: Preflight native LLSD settings and keyboard records
        shell: pwsh
        run: python kami/performance/validate-config-inputs.py
      - name: Restore omitted snapshot preview source
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen
          base = 'https://raw.githubusercontent.com/KittyBarnett/rlva/074d3a8dcf875b1837bf946f71a7087ceed33230/'
          paths = ['indra/newview/llfloaterbigpreview.cpp', 'indra/newview/llfloaterbigpreview.h', 'indra/newview/skins/default/xui/en/floater_big_preview.xml']
          for name in paths:
              text = urlopen(base + name).read().decode('utf-8')
              text = text.replace('BOOL postBuild()', 'bool postBuild()').replace('BOOL LLFloaterBigPreview::postBuild()', 'bool LLFloaterBigPreview::postBuild()')
              Path(name).write_text(text)
          p = Path('indra/newview/CMakeLists.txt')
          p.write_text(p.read_text().replace(chr(34)+'--openal=${USE_OPENAL}'+chr(34), chr(34)+'--fmodstudio=${USE_FMODSTUDIO}'+chr(34)+' '+chr(34)+'--openal=${USE_OPENAL}'+chr(34)))
          p = Path('indra/cmake/Copy3rdPartyLibs.cmake')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'openjpeg.dll'))
          p = Path('indra/newview/viewer_manifest.py')
          p.write_text(''.join(line for line in p.read_text().splitlines(True) if line.strip() != 'self.path("openjpeg.dll")'))
          p = Path('indra/newview/kombatantstudio.h')
          p.write_text(p.read_text().replace('[this]() {', '[this](LLUICtrl*, const LLSD&) {'))
          p = Path('kombatant/build-windows.sh')
          p.write_text(p.read_text().replace('autobuild build -A 64 -c ReleaseOS', 'autobuild build --no-configure -A 64 -c ReleaseOS'))
          p = Path('indra/cmake/BuildVersion.cmake')
          p.write_text(p.read_text().replace('VIEWER_SHORT_VERSION REGEX', 'VIEWER_SHORT_VERSION LIMIT_COUNT 1 REGEX'))
      - name: Integrate native FSR and XeSS into viewer source
        shell: pwsh
        run: python kombatant/upscale/apply-upscalers.py
      - name: Install Python build tooling
        run: python -m pip install autobuild llsd pillow "cmake<4"
      - name: Apply KAMI Viewer logo and identity
        shell: pwsh
        run: python kami/branding/apply-branding.py
      - name: Apply static Beyond Reality fire-garden theme
        shell: pwsh
        run: python kami/theme/apply-static-theme.py
      - name: Remove bundled FX runtime and integrate Performance Mode
        shell: pwsh
        run: python kami/performance/apply-native-performance.py
      - name: Add native advanced lighting and adaptive resolution
        shell: pwsh
        run: python kami/performance/add-advanced-native.py
      - name: Integrate experimental native PBR near-field indirect lighting
        shell: pwsh
        run: python kami/performance/add-native-bounce.py
      - name: Install adaptive performance controls and Potato Mode
        shell: pwsh
        run: python kami/performance/apply-smart-performance.py
      - name: Add performance-friendly lighting and skin options
        shell: pwsh
        run: python kami/performance/add-balanced-graphics.py
      - name: Integrate shadow filtering, reflections, shader caching and auto optimization
        shell: pwsh
        run: python kami/performance/add-mw-render-controls.py
      - name: Integrate experimental OpenGL optical-flow frame generation
        shell: pwsh
        run: python kami/framegen/apply-framegen.py
      - name: Integrate live current-scene graphics preview
        shell: pwsh
        run: python kami/preview/apply-live-preview.py
      - name: Integrate fast login without bypassing outfit readiness
        shell: pwsh
        run: python kami/loading/apply-fast-loading.py
      - name: Clean KAMI login layout and identity
        shell: pwsh
        run: python kami/theme/clean-login.py
      - name: Restore approved KAMI Beyond Reality login theme
        shell: pwsh
        run: python kami/theme/fix-login-theme.py
      - name: Correct FPS cap units and separate quality target
        shell: pwsh
        run: python kami/performance/fix-fps-controls.py
      - name: Wire shadow softening independently of SSAO
        shell: pwsh
        run: python kami/shadows/apply-shadow-filter-fix.py
      - name: Contain Performance Mode scaled-view cropping
        shell: pwsh
        run: python kami/stability/keep-performance-native.py
      - name: Remove unsupported 12K live rendering
        shell: pwsh
        run: python kami/stability/remove-12k-live.py
      - name: Remove KAMI native color grading (retain built-in gamma and tone mapping)
        shell: pwsh
        run: python kami/stability/remove-native-color-grading.py
      - name: Fix native AO darkening slider and diffuse occlusion strength
        shell: pwsh
        run: python kami/stability/fix-ao-darkening.py
      - name: Make actual optical-flow frame generation status visible
        shell: pwsh
        run: python kami/stability/fix-optical-flow-runtime.py
      - name: Fix live SSR reflection texture allocation on toggle
        shell: pwsh
        run: python kami/stability/fix-ssr-toggle.py
      - name: Explain actual Performance preset and measured OFF/ON FPS comparison
        shell: pwsh
        run: python kami/stability/explain-performance-preset.py
      - name: Wire five verified quality presets to actual renderer controls
        shell: pwsh
        run: python kami/performance/verify-and-wire-quality-presets.py
      - name: Optimize remote avatar body physics without altering self avatar
        shell: pwsh
        run: python kami/performance/apply-adaptive-avatar-physics.py
      - name: Stabilize and expose actual native 4K/8K world buffer resolution
        shell: pwsh
        run: python kami/stability/fix-live-resolution-quality.py
      - name: Apply approved Fire Garden theme across all native KAMI windows
        shell: pwsh
        run: python kami/theme/apply-fire-garden-ui.py
      - name: Remove obsolete Native Graphics Lab and KAMI Photo Studio UI
        shell: pwsh
        run: python kami/stability/remove-native-lab-studio.py
      - name: Keep all original graphics toggles in Fire Garden base kit
        shell: pwsh
        run: python kami/theme/preserve-base-graphics-kit.py
      - name: Add optional Smart Avatar Physics scheduling and live CPU metrics
        shell: pwsh
        run: python kami/physics/apply-smart-avatar-physics.py
      - name: Add native KAMI Hardware Monitor with Windows usage telemetry
        shell: pwsh
        run: python kami/performance/apply-hardware-monitor.py
      - name: Install KAMI Render Doctor, Smart World, Camera Director and Intelligent Profiles
        shell: pwsh
        run: python kami/signature/apply-signature-features.py
      - name: Install four local EEP atmospheres and reversible Fire Garden mood controls
        shell: pwsh
        run: python kami/atmosphere/apply-atmosphere.py
      - name: Install native KAMI Session Recovery, safe local snapshots and crash prompt
        shell: pwsh
        run: python kami/recovery/apply-session-recovery.py
      - name: Add native live Avatar Quality plus FPS control
        shell: pwsh
        run: python kami/avatars/apply-avatar-quality.py
      - name: Verify reversible avatar-quality live LOD and complete Display scroll
        shell: pwsh
        run: python kami/avatars/verify-avatar-quality.py
      - name: Add opt-in native Dark Cinematic PBR material, EEP lighting and avatar detail
        shell: pwsh
        run: python kami/cinematic/apply-dark-cinematic.py
      - name: Verify all three Dark Cinematic live-render feature paths
        shell: pwsh
        run: python kami/cinematic/verify-dark-cinematic.py
      - name: Install native experimental Diamond Glint Engine
        shell: pwsh
        run: python kami/jewelry/apply-diamond-glints.py
      - name: Verify native diamond glint wiring and material limits
        shell: pwsh
        run: python kami/jewelry/verify-diamond-glints.py
      - name: Install user-controlled RLV emergency safety center (no unsupported engine)
        shell: pwsh
        run: python kami/rlv/apply-rlv-safety.py
      - name: Verify RLV default-deny, real panic menu and no unreviewed RLVa parser
        shell: pwsh
        run: python kami/rlv/verify-rlv-safety.py
      - name: Verify KAMI four signature feature engines, controls and telemetry
        shell: pwsh
        run: python kami/signature/verify-signature-features.py
      - name: Verify real KAMI Atmosphere Engine and Second Life EEP permissions
        shell: pwsh
        run: python kami/atmosphere/verify-atmosphere.py
      - name: Verify safe and private native KAMI Session Recovery
        shell: pwsh
        run: python kami/recovery/verify-session-recovery.py
      - name: Verify all six real Smart Avatar Physics optimizations and performance stats
        shell: pwsh
        run: python kami/physics/verify-smart-avatar-physics.py
      - name: Validate KAMI Firestorm-style WASD movement defaults
        shell: pwsh
        run: python kami/performance/validate-wasd-controls.py
      - name: Verify all five preset quality levels and native 4K/8K FPS contracts
        shell: pwsh
        run: python kami/performance/verify-preset-contracts.py
      - name: Validate external-only GShade assets and absence of bundled hooks
        shell: pwsh
        run: python kami/gshade/verify-gshade-fx.py
      - name: Verify adaptive avatar physics and actual hardware performance telemetry
        shell: pwsh
        run: python kami/performance/verify-physics-and-monitor.py
      - name: Validate all KAMI native graphics patches with named assertions
        shell: pwsh
        run: python kami/stability/validate-next-build.py
      - name: Verify native settings and all legacy WASD keybindings
        shell: pwsh
        run: python kami/performance/validate-config-inputs.py
      - name: Fetch pinned AMD FSR and Intel XeSS SDKs
        shell: pwsh
        run: ./kombatant/upscale/build-upscalers.ps1
      - name: Install stabilized ray AO shader
        shell: pwsh
        run: Copy-Item kami/rtx/ray_ao.hlsl kombatant/rtx/ray_ao.hlsl -Force
      - name: Build experimental DLSS and DXR module
        shell: pwsh
        run: ./kombatant/build-rtx.ps1
      - name: Build compatible OpenJPEG from public source
        shell: bash
        run: |
          git clone --depth 1 --branch version.1.5.2 https://github.com/uclouvain/openjpeg.git .openjpeg-source
          test "$(git -C .openjpeg-source rev-parse HEAD)" = 9586bc669c4623912ca657328579c878d74164a5
          python -c "from pathlib import Path; p=Path('.openjpeg-source/libopenjpeg/opj_includes.h'); p.write_text(p.read_text().replace('#if defined(_MSC_VER) || defined(__BORLANDC__)', '#if (defined(_MSC_VER) && _MSC_VER < 1800) || defined(__BORLANDC__)'))"
          cmake -S .openjpeg-source -B .openjpeg-build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=OFF -DBUILD_TESTING=OFF -DOPENJPEG_INSTALL_INCLUDE_DIR=include/openjpeg -DCMAKE_INSTALL_PREFIX="$PWD/.openjpeg-install"
          cmake --build .openjpeg-build --config Release --parallel 2
          cmake --install .openjpeg-build --config Release
          python - <<'PY'
          from pathlib import Path
          Path('indra/cmake/OpenJPEG.cmake').write_text('set(OPENJPEG_INCLUDE_DIR "'+str(Path('.openjpeg-install/include/openjpeg').resolve()).replace(chr(92),'/')+'")\nset(OPENJPEG_LIBRARIES "'+str(Path('.openjpeg-install/lib/openjpeg.lib').resolve()).replace(chr(92),'/')+'")\nadd_definitions(-DOPJ_STATIC)\n')
          PY
      - name: Configure and compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -c "set -o pipefail; bash kombatant/build-windows.sh 2>&1 | tee kombatant-build.log"
      - name: Stage experimental DLSS and DXR runtime
        shell: pwsh
        run: ./kombatant/build-rtx.ps1 -StageOnly
      - name: Stage AMD FSR and Intel XeSS runtimes
        shell: pwsh
        run: ./kombatant/upscale/build-upscalers.ps1 -StageOnly
      - name: Stage optional externally installed GShade shader assets
        shell: pwsh
        run: ./kami/gshade/stage-external-assets.ps1
      - name: Stage and validate portable runtime assets
        shell: pwsh
        run: python kami/packaging/stage-portable-data.py
      - name: Stage KAMI Viewer portable executable
        shell: pwsh
        run: |
          $release = 'build-vc170-64/newview/Release'
          $source = Join-Path $release 'blackdragon-bin.exe'
          if (-not (Test-Path $source)) { throw 'Viewer executable not found after build' }
          Copy-Item $source (Join-Path $release 'KAMIViewer.exe') -Force
          Remove-Item $source -Force
      - name: Cache downloaded libraries
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .autobuild-installables
          key: kombatant-win-deps-v1-${{ github.run_id }}
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kami-viewer-windows-build-log
          path: |
            kombatant-build.log
            build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
      - name: Preserve compiled build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kami-viewer-windows-release-output
          path: build-vc170-64/newview/Release/
          if-no-files-found: error
          retention-days: 7
