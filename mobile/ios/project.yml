name: KAMI
options:
  bundleIdPrefix: com.kamiviewer
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: KAMI
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CODE_SIGN_STYLE: Automatic
targets:
  KAMI:
    type: application
    platform: iOS
    sources: [KAMI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamiviewer.ios
  KAMITests:
    type: bundle.unit-test
    platform: iOS
    sources: [KAMITests]
    dependencies:
      - target: KAMI
schemes:
  KAMI:
    build:
      targets:
        KAMI: all
        KAMITests: [test]
    test:
      targets: [KAMITests]
